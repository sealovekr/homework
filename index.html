<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 오늘의 숙제 모험</title>
<!-- Supabase 라이브러리 추가 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", Arial, sans-serif; background: linear-gradient(135deg, #fff5d9, #e8f7ff); color: #333; min-height: 100vh; transition: 0.3s; }
body.dark { background: linear-gradient(135deg, #20243a, #172d3b); color: #eee; }
.container { max-width: 900px; margin: auto; padding: 20px; }

header { background: rgba(255,255,255,0.9); border-radius: 25px; padding: 22px; margin-bottom: 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; gap: 15px; }
.dark header, .dark .card, .dark .task-card, .dark .add-box, .dark .stat { background: rgba(35,40,65,0.95); }
h1 { margin: 0; font-size: 28px; }
.subtitle { margin-top: 6px; color: #777; font-size: 14px; }
.dark .subtitle { color: #bbb; }

.header-actions { display: flex; gap: 8px; }
.icon-btn { border: none; background: #eee; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
.icon-btn:hover { transform: scale(1.08); }
.dark .icon-btn { background: #323854; color: white; }

.hero { background: linear-gradient(135deg, #7c5cff, #45caff); color: white; border-radius: 28px; padding: 25px; display: flex; align-items: center; gap: 20px; margin-bottom: 18px; box-shadow: 0 12px 30px rgba(80,90,220,0.25); }
.character { font-size: 75px; animation: float 3s ease-in-out infinite; cursor: pointer; user-select: none; transition: 0.2s; }
.character:hover { transform: scale(1.1); }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.hero-text { flex: 1; }
.hero-text h2 { margin: 0 0 8px; }
.xp-bar { background: rgba(255,255,255,0.35); height: 15px; border-radius: 20px; overflow: hidden; }
.xp-fill { height: 100%; width: 0%; background: #ffe45c; border-radius: 20px; transition: width 0.5s; }
.xp-text { font-size: 13px; margin-top: 7px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.stat { background: white; border-radius: 20px; padding: 18px 10px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
.stat-icon { font-size: 25px; }
.stat-number { font-size: 25px; font-weight: bold; margin-top: 5px; }
.stat-label { color: #777; font-size: 12px; }
.dark .stat-label { color: #bbb; }

.card { background: white; border-radius: 25px; padding: 22px; margin-bottom: 18px; box-shadow: 0 7px 22px rgba(0,0,0,0.06); }
.section-title { font-size: 21px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
.admin-badge { font-size: 12px; background: #7c5cff; color: white; padding: 4px 10px; border-radius: 20px; display: none; }
.admin-mode .admin-badge { display: inline-block; }

.progress-wrap { display: flex; align-items: center; gap: 18px; }
.circle { width: 105px; height: 105px; min-width: 105px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: conic-gradient(#7c5cff 0deg, #eee 0deg); position: relative; transition: background 0.5s; }
.circle::before { content: ""; position: absolute; width: 78px; height: 78px; background: white; border-radius: 50%; }
.dark .circle::before { background: #232841; }
.circle-text { position: relative; z-index: 1; font-size: 22px; font-weight: bold; }
.progress-info { flex: 1; }
.progress-info h3 { margin: 0 0 7px; }
.progress-info p { margin: 0; color: #777; font-size: 14px; }
.dark .progress-info p { color: #bbb; }

/* 관리자 전용 제어 UI */
.add-box { display: none; gap: 10px; background: #f8f8ff; padding: 12px; border-radius: 18px; margin-bottom: 15px; }
.admin-mode .add-box { display: flex; }
.add-box input, .add-box select { border: 2px solid #eee; border-radius: 12px; padding: 12px; font-size: 14px; outline: none; background: white; }
.dark .add-box input, .dark .add-box select { background: #292e49; color: white; border-color: #444a68; }
.add-box input { flex: 1; }
.add-box input:focus, .add-box select:focus { border-color: #7c5cff; }
.add-btn { border: none; background: linear-gradient(135deg, #7c5cff, #45caff); color: white; border-radius: 12px; padding: 0 18px; font-weight: bold; cursor: pointer; font-size: 14px; }
.add-btn:hover { opacity: 0.9; }

.task-list { display: flex; flex-direction: column; gap: 10px; }
.task-card { background: #fff; border: 2px solid #f0f0f5; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; transition: 0.25s; }
.task-card:hover { transform: translateY(-2px); box-shadow: 0 7px 18px rgba(0,0,0,0.06); }
.dark .task-card { border-color: #3e4563; }
.task-card.completed { opacity: 0.65; }
.task-check { width: 28px; height: 28px; min-width: 28px; border-radius: 50%; border: 3px solid #7c5cff; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
.dark .task-check { background: #292e49; }
.task-card.completed .task-check { background: #7c5cff; }
.task-info { flex: 1; }
.task-title { font-weight: bold; font-size: 16px; }
.task-card.completed .task-title { text-decoration: line-through; }
.task-meta { margin-top: 4px; color: #888; font-size: 12px; }
.task-xp { background: #fff1a8; color: #775d00; padding: 5px 9px; border-radius: 20px; font-size: 11px; font-weight: bold; }

.delete-btn { border: none; background: #ffe9ed; color: #e85068; border-radius: 10px; width: 34px; height: 34px; cursor: pointer; display: none; }
.admin-mode .delete-btn { display: inline-flex; align-items: center; justify-content: center; }
.delete-btn:hover { background: #ffd3da; }

.empty { text-align: center; padding: 30px 10px; color: #999; }
.empty-icon { font-size: 45px; margin-bottom: 8px; }
.toast { position: fixed; left: 50%; bottom: 25px; transform: translate(-50%, 100px); background: #222; color: white; padding: 13px 20px; border-radius: 30px; opacity: 0; transition: 0.35s; z-index: 1000; box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.level-up { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; z-index: 999; }
.level-up.show { display: flex; }
.level-box { background: white; color: #333; border-radius: 30px; padding: 35px; text-align: center; width: min(90%, 400px); animation: pop 0.45s ease; }
.dark .level-box { background: #252a43; color: white; }
.level-box .big { font-size: 70px; }
.level-box h2 { margin: 8px 0; color: #7c5cff; }
.level-box button { border: none; background: linear-gradient(135deg, #7c5cff, #45caff); color: white; padding: 12px 25px; border-radius: 15px; cursor: pointer; font-weight: bold; margin-top: 15px; }
@keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

@media (max-width: 650px) {
  .container { padding: 12px; }
  header { padding: 17px; }
  h1 { font-size: 23px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .add-box { flex-wrap: wrap; }
  .add-box input { width: 100%; flex-basis: 100%; }
  .add-box select { flex: 1; }
  .progress-wrap { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>✨ 오늘의 숙제 모험</h1>
      <div class="subtitle">숙제를 하나씩 완료하고 모험가 레벨을 올려보세요!</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="adminBtn" title="관리자 모드 (부모님 전용)">🔒</button>
      <button class="icon-btn" id="themeBtn" title="다크모드">🌙</button>
    </div>
  </header>

  <section class="hero">
    <div class="character" id="character" title="클릭해서 응원받기">🧙‍♂️</div>
    <div class="hero-text">
      <h2 id="levelTitle">Lv. 1 새싹 모험가</h2>
      <p id="heroMessage">오늘도 멋진 모험을 시작해볼까요? 🚀</p>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      <div class="xp-text" id="xpText">XP 0 / 100</div>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><div class="stat-icon">📚</div><div class="stat-number" id="totalCount">0</div><div class="stat-label">전체 숙제</div></div>
    <div class="stat"><div class="stat-icon">✅</div><div class="stat-number" id="completedCount">0</div><div class="stat-label">완료</div></div>
    <div class="stat"><div class="stat-icon">⭐</div><div class="stat-number" id="totalXP">0</div><div class="stat-label">총 XP</div></div>
    <div class="stat"><div class="stat-icon">🔥</div><div class="stat-number" id="streak">0</div><div class="stat-label">연속 달성</div></div>
  </section>

  <section class="card">
    <div class="section-title">🎯 오늘의 진행률</div>
    <div class="progress-wrap">
      <div class="circle" id="progressCircle"><div class="circle-text" id="progressPercent">0%</div></div>
      <div class="progress-info">
        <h3 id="progressTitle">모험을 시작해볼까요?</h3>
        <p id="progressMessage">첫 번째 퀘스트를 완료해보세요!</p>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <span>📝 오늘의 퀘스트</span>
      <span class="admin-badge">관리자 모드 활성</span>
    </div>
    <div class="add-box">
      <input type="text" id="taskInput" placeholder="새로운 퀘스트 등록 (예: 수학 문제집 10쪽 풀기)" maxlength="80">
      <select id="xpSelect">
        <option value="10">쉬움 · 10 XP</option>
        <option value="20" selected>보통 · 20 XP</option>
        <option value="30">어려움 · 30 XP</option>
        <option value="50">보스 · 50 XP</option>
      </select>
      <button class="add-btn" id="addBtn">＋ 등록</button>
    </div>
    <div class="task-list" id="taskList"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="level-up" id="levelUp">
  <div class="level-box">
    <div class="big">🎉</div>
    <h2>LEVEL UP!</h2>
    <p id="levelUpText">새로운 레벨에 도달했습니다!</p>
    <button id="closeLevelUp">계속 모험하기</button>
  </div>
</div>

<script>
/* ========================================================
   1. Supabase 연동 설정 (경로 오타 수정 완료)
======================================================== */
const SUPABASE_URL = "https://hkcbsmeiqwyjekakiusc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrY2JzbWVpcXd5amVrYWtpdXNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzk3MzgsImV4cCI6MjEwNTY1NTczOH0.lEF5p3BLkiW_ruDgfYIZ7vNex7GAvD2Ag4idJjJgY0w";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ADMIN_PIN = "1234"; 
let isAdmin = false;

let data = {
  tasks: [],
  xp: 0,
  totalCompleted: 0,
  completedDates: [],
  darkMode: false
};

/* DOM 변수 */
const taskInput = document.getElementById("taskInput");
const xpSelect = document.getElementById("xpSelect");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");
const totalCount = document.getElementById("totalCount");
const completedCount = document.getElementById("completedCount");
const totalXP = document.getElementById("totalXP");
const streak = document.getElementById("streak");
const xpFill = document.getElementById("xpFill");
const xpText = document.getElementById("xpText");
const levelTitle = document.getElementById("levelTitle");
const heroMessage = document.getElementById("heroMessage");
const progressCircle = document.getElementById("progressCircle");
const progressPercent = document.getElementById("progressPercent");
const progressTitle = document.getElementById("progressTitle");
const progressMessage = document.getElementById("progressMessage");
const toast = document.getElementById("toast");
const themeBtn = document.getElementById("themeBtn");
const adminBtn = document.getElementById("adminBtn");
const character = document.getElementById("character");
const levelUp = document.getElementById("levelUp");
const levelUpText = document.getElementById("levelUpText");
const closeLevelUp = document.getElementById("closeLevelUp");

function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag] || tag));
}

function getLevel(xp) { return Math.floor(xp / 100) + 1; }
function getLevelXP(xp) { return xp % 100; }
function getLevelName(level) {
  if (level < 3) return "새싹 모험가";
  if (level < 5) return "견습 모험가";
  if (level < 8) return "용감한 모험가";
  if (level < 12) return "숙련된 모험가";
  if (level < 20) return "전설의 모험가";
  return "✨ 신화의 모험가";
}

function todayString() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

let toastTimer;
function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove("show"); }, 2200);
}

/* ========================================================
   2. 클라우드(Supabase) 데이터 로드 및 실시간 동기화
======================================================== */
async function loadCloudData() {
  const { data: tasks, error: taskErr } = await supabase.from('tasks').select('*').order('id', { ascending: true });
  if (!taskErr && tasks) data.tasks = tasks;

  const { data: profile, error: profErr } = await supabase.from('user_profile').select('*').eq('id', 1).single();
  if (!profErr && profile) {
    data.xp = profile.xp || 0;
    data.totalCompleted = profile.total_completed || 0;
    data.completedDates = profile.completed_dates || [];
  }

  render();
}

supabase.channel('cloud-updates')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => loadCloudData())
  .on('postgres_changes', { event: '*', schema: 'public', table: 'user_profile' }, () => loadCloudData())
  .subscribe();

async function addTask() {
  const title = taskInput.value.trim();
  if (!title) {
    showToast("📝 숙제 이름을 입력해주세요!");
    taskInput.focus();
    return;
  }
  const xp = Number(xpSelect.value);
  const newTask = {
    id: Date.now(),
    title,
    xp,
    completed: false,
    created_at: todayString()
  };

  const { error } = await supabase.from('tasks').insert([newTask]);
  if (error) {
    showToast("⚠️ 등록 실패: 데이터베이스 연결 확인 필요");
  } else {
    taskInput.value = "";
    showToast("🎯 새로운 퀘스트가 전송되었습니다!");
  }
}

async function toggleTask(id) {
  const task = data.tasks.find(t => t.id === id);
  if (!task) return;

  const oldLevel = getLevel(data.xp);
  let newXP = data.xp;
  let newCompleted = data.totalCompleted;
  let dates = [...data.completedDates];

  if (!task.completed) {
    task.completed = true;
    newXP += task.xp;
    newCompleted++;
    const today = todayString();
    if (!dates.includes(today)) dates.push(today);
    showToast(`🎉 퀘스트 완료! +${task.xp} XP`);
  } else {
    task.completed = false;
    newXP = Math.max(0, newXP - task.xp);
    newCompleted = Math.max(0, newCompleted - 1);
    showToast("↩️ 퀘스트를 다시 진행 중으로 변경했습니다.");
  }

  await supabase.from('tasks').update({ completed: task.completed }).eq('id', id);
  await supabase.from('user_profile').update({
    xp: newXP,
    total_completed: newCompleted,
    completed_dates: dates
  }).eq('id', 1);

  const newLevel = getLevel(newXP);
  if (newLevel > oldLevel) showLevelUp(newLevel);
}

async function deleteTask(id) {
  if (!confirm("이 퀘스트를 삭제하시겠습니까?")) return;
  const task = data.tasks.find(t => t.id === id);
  if (!task) return;

  if (task.completed) {
    const newXP = Math.max(0, data.xp - task.xp);
    const newCompleted = Math.max(0, data.totalCompleted - 1);
    await supabase.from('user_profile').update({
      xp: newXP,
      total_completed: newCompleted
    }).eq('id', 1);
  }

  await supabase.from('tasks').delete().eq('id', id);
  showToast("🗑️ 퀘스트를 삭제했습니다.");
}

/* ========================================================
   3. 화면 렌더링
======================================================== */
function render() {
  renderTasks();
  renderStats();
  renderXP();
  renderProgress();
  renderTheme();
}

function renderTasks() {
  if (data.tasks.length === 0) {
    taskList.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🗺️</div>
        <div>등록된 퀘스트가 없습니다!</div>
        <small>관리자 모드(🔒)를 눌러 숙제를 등록해주세요.</small>
      </div>
    `;
    return;
  }
  taskList.innerHTML = data.tasks.map(task => `
    <div class="task-card ${task.completed ? "completed" : ""}">
      <button class="task-check" onclick="toggleTask(${task.id})" aria-label="숙제 완료">
        ${task.completed ? "✓" : ""}
      </button>
      <div class="task-info">
        <div class="task-title">${escapeHTML(task.title)}</div>
        <div class="task-meta">${task.completed ? "🎉 완료한 퀘스트" : "⚔️ 진행 중인 퀘스트"}</div>
      </div>
      <div class="task-xp">+${task.xp} XP</div>
      <button class="delete-btn" onclick="deleteTask(${task.id})" aria-label="삭제">🗑️</button>
    </div>
  `).join("");
}

function renderStats() {
  const total = data.tasks.length;
  const completed = data.tasks.filter(t => t.completed).length;
  totalCount.textContent = total;
  completedCount.textContent = completed;
  totalXP.textContent = data.xp;
  streak.textContent = calculateStreak();
}

function renderXP() {
  const level = getLevel(data.xp);
  const currentXP = getLevelXP(data.xp);
  levelTitle.textContent = `Lv. ${level} ${getLevelName(level)}`;
  xpFill.style.width = `${currentXP}%`;
  xpText.textContent = `XP ${currentXP} / 100`;

  const messages = [
    "오늘도 멋진 모험을 시작해볼까요? 🚀",
    "조금씩 해도 괜찮아요. 계속 전진! 🌱",
    "훌륭해요! 모험가의 길을 걷고 있어요! ⚔️",
    "대단해요! 다음 레벨이 기다리고 있어요! ⭐",
    "오늘의 숙제도 정복할 수 있어요! 🔥"
  ];
  heroMessage.textContent = messages[Math.floor(Math.random() * messages.length)];
}

function renderProgress() {
  const total = data.tasks.length;
  const completed = data.tasks.filter(t => t.completed).length;
  const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

  progressPercent.textContent = `${percent}%`;
  progressCircle.style.background = `conic-gradient(#7c5cff ${percent * 3.6}deg, #eee ${percent * 3.6}deg)`;

  if (percent === 0) {
    progressTitle.textContent = "모험을 시작해볼까요?";
    progressMessage.textContent = "첫 번째 퀘스트를 완료해보세요!";
  } else if (percent < 50) {
    progressTitle.textContent = "좋은 출발이에요! 🌱";
    progressMessage.textContent = "조금만 더 힘내면 다음 단계로 갈 수 있어요.";
  } else if (percent < 100) {
    progressTitle.textContent = "절반 이상 완료! 🔥";
    progressMessage.textContent = "거의 다 왔어요! 마지막 퀘스트도 도전해보세요.";
  } else {
    progressTitle.textContent = "오늘의 모험 완료! 🏆";
    progressMessage.textContent = "모든 숙제를 완료했습니다. 정말 멋져요!";
  }
}

function calculateStreak() {
  if (data.completedDates.length === 0) return 0;
  const dates = [...new Set(data.completedDates)].sort().reverse();
  let streakCount = 0;
  let current = new Date();

  for (const dateString of dates) {
    const expected = formatDate(current);
    if (dateString === expected) {
      streakCount++;
      current.setDate(current.getDate() - 1);
    } else if (dateString < expected) {
      break;
    }
  }
  return streakCount;
}

function formatDate(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function renderTheme() {
  document.body.classList.toggle("dark", data.darkMode);
  themeBtn.textContent = data.darkMode ? "☀️" : "🌙";
}

themeBtn.addEventListener("click", () => {
  data.darkMode = !data.darkMode;
  renderTheme();
  showToast(data.darkMode ? "🌙 다크모드로 변경했습니다." : "☀️ 밝은 모드로 변경했습니다.");
});

// 관리자 모드 제어
adminBtn.addEventListener("click", () => {
  if (isAdmin) {
    isAdmin = false;
    document.body.classList.remove("admin-mode");
    adminBtn.textContent = "🔒";
    showToast("사용자 모드로 전환되었습니다.");
  } else {
    const enteredPin = prompt("관리자 PIN 번호를 입력하세요 (기본: 1234):");
    if (enteredPin === ADMIN_PIN) {
      isAdmin = true;
      document.body.classList.add("admin-mode");
      adminBtn.textContent = "🔓";
      showToast("관리자 모드가 활성화되었습니다.");
    } else if (enteredPin !== null) {
      alert("PIN 번호가 올바르지 않습니다.");
    }
  }
});

character.addEventListener("click", () => {
  const messages = [
    "🔥 할 수 있어요!", "💪 조금만 더 힘내요!", "⭐ 최고의 모험가!",
    "🚀 숙제를 정복하러 가볼까요?", "🍀 오늘도 좋은 하루!", "⚔️ 퀘스트를 완료해봅시다!"
  ];
  showToast(messages[Math.floor(Math.random() * messages.length)]);
  character.style.transform = "scale(1.25) rotate(8deg)";
  setTimeout(() => { character.style.transform = ""; }, 250);
});

function showLevelUp(level) {
  levelUpText.textContent = `축하합니다! Lv. ${level} ${getLevelName(level)}이 되었습니다!`;
  levelUp.classList.add("show");
}

closeLevelUp.addEventListener("click", () => {
  levelUp.classList.remove("show");
});

addBtn.addEventListener("click", addTask);
taskInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") addTask();
});

// 시작 시 데이터베이스 불러오기
loadCloudData();
</script>
</body>
</html>
